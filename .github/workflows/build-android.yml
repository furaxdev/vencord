name: Build Android APK (Vencord4Mobile)

on:
  push:
    branches: [main, "claude/vencord4mobile-android-*"]
  workflow_dispatch:

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      # ── Node + Vencord bundle ────────────────────────────────────────────
      - uses: actions/setup-node@v4
        with: { node-version: 22 }

      - uses: pnpm/action-setup@v4

      - run: pnpm install

      - name: Build Vencord mobile bundle
        run: pnpm buildWeb --skip-extension
        # → dist/Vencord.mobile.user.js

      - name: Copy Vencord bundle into Android assets
        run: cp dist/Vencord.mobile.user.js android/app/src/main/assets/vencord.js

      # ── Java + Android SDK ───────────────────────────────────────────────
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }

      - uses: android-actions/setup-android@v3

      # ── Build APK ────────────────────────────────────────────────────────
      - name: Build release APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      # ── Sign with a generated debug key ─────────────────────────────────
      - name: Sign APK
        run: |
          keytool -genkey -v -keystore debug.keystore -alias key \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android \
            -dname "CN=Vencord4Mobile,O=Vencord,C=US" 2>/dev/null

          $ANDROID_HOME/build-tools/*/apksigner sign \
            --ks debug.keystore --ks-key-alias key \
            --ks-pass pass:android --key-pass pass:android \
            --out vencord4mobile.apk \
            android/app/build/outputs/apk/release/app-release.apk

      # ── Upload ───────────────────────────────────────────────────────────
      - uses: actions/upload-artifact@v4
        with:
          name: vencord4mobile-${{ github.sha }}
          path: vencord4mobile.apk
          retention-days: 14
